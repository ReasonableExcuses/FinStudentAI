version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finstudent-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./finstudent.db
      - SECRET_KEY=finstudent_super_secret_jwt_key_2026_idp_secure
      - FALLBACK_MODE=true
    volumes:
      - ./backend/data:/app/data
      - backend-db:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finstudent-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-db:
